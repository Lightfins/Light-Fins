<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1e2a42" stroke-width="3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow)" stroke-width="2" stroke-dasharray="40 20" opacity="0.5"/>
  <!-- Crosshair lines -->
  <line x1="256" y1="80" x2="256" y2="180" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#neon)"/>
  <line x1="256" y1="332" x2="256" y2="432" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#neon)"/>
  <line x1="80" y1="256" x2="180" y2="256" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#neon)"/>
  <line x1="332" y1="256" x2="432" y2="256" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#neon)"/>
  <!-- Equity curve / chart line -->
  <polyline points="120,320 160,310 200,290 230,300 260,240 290,220 320,250 350,190 380,170"
    fill="none" stroke="#00e676" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <!-- Glow fill under curve -->
  <polygon points="120,320 160,310 200,290 230,300 260,240 290,220 320,250 350,190 380,170 380,340 120,340"
    fill="#00e676" opacity="0.08"/>
  <!-- Center diamond (target) -->
  <polygon points="256,210 290,256 256,302 222,256" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#neon)"/>
  <polygon points="256,230 274,256 256,282 238,256" fill="#00e5ff" opacity="0.15"/>
  <!-- Corner brackets -->
  <path d="M100,140 L100,100 L140,100" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>
  <path d="M372,100 L412,100 L412,140" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>
  <path d="M100,372 L100,412 L140,412" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>
  <path d="M372,412 L412,412 L412,372" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.6"/>
  <!-- "CC" text -->
  <text x="256" y="440" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="36" fill="#00e5ff" opacity="0.7" letter-spacing="8">CC</text>
</svg>
